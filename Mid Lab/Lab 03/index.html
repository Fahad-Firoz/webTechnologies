<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register & Support Us</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Create Your Account</h1>
      <p>Join thousands who are making a difference</p>
    </div>

    <form id="regForm" novalidate>
      <!-- Full Name -->
      <div class="input-group">
        <label>Full Name <span class="req">*</span></label>
        <input type="text" id="fullname" maxlength="50" required>
        <span class="counter">0/50</span>
      </div>

      <!-- Email -->
      <div class="input-group">
        <label>Email Address <span class="req">*</span></label>
        <input type="email" id="email" required>
      </div>

      <!-- Passwords -->
      <div class="input-group">
        <label>Password <span class="req">*</span></label>
        <input type="password" id="password" required>
        <small>At least 6 characters</small>
      </div>

      <div class="input-group">
        <label>Confirm Password <span class="req">*</span></label>
        <input type="password" id="confirmPassword" required>
      </div>

      <!-- Gender -->
      <div class="input-group">
        <label>Gender <span class="req">*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male" required> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>
      </div>

      <!-- DOB & Country -->
      <div class="row">
        <div class="input-group">
          <label>Date of Birth <span class="req">*</span></label>
          <input type="date" id="dob" required>
        </div>
        <div class="input-group">
          <label>Country <span class="req">*</span></label>
          <select id="country" required>
            <option value="">Choose...</option>
            <option value="Bangladesh" selected>Bangladesh</option>
            <option value="USA">USA</option>
            <option value="India">India</option>
            <option value="UK">United Kingdom</option>
            <option value="Canada">Canada</option>
          </select>
        </div>
      </div>

      <!-- Donation Amount -->
      <div class="input-group">
        <label>Support Us (Optional)</label>
        <div class="radio-group">
          <label><input type="radio" name="donation" value="10">$10</label>
          <label><input type="radio" name="donation" value="25">$25</label>
          <label><input type="radio" name="donation" value="50">$50</label>
          <label><input type="radio" name="donation" value="100">$100</label>
          <label><input type="radio" name="donation" value="other">Other</label>
        </div>
      </div>

      <div id="otherAmount" class="input-group hidden">
        <label>Custom Amount ($)</label>
        <input type="number" id="customAmount" min="1" step="0.01" placeholder="15.00">
      </div>

      <!-- Recurring -->
      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="recurring">
          Make this a monthly gift
        </label>
      </div>

      <div id="recurringBox" class="hidden">
        <div class="input-group">
          <label>Frequency</label>
          <select id="frequency">
            <option value="monthly">Every Month</option>
            <option value="quarterly">Every 3 Months</option>
            <option value="annually">Every Year</option>
          </select>
        </div>
        <div class="highlight-box">
          <strong>Yearly Total: <span id="yearTotal">$0.00</span></strong>
        </div>
      </div>

      <!-- Honor / Memory -->
      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="honor">
          In honor or memory donation
        </label>
      </div>

      <div id="honorBox" class="hidden">
        <div class="input-group">
          <input type="text" id="honorName" placeholder="Name of person">
        </div>
        <div class="radio-group">
          <label><input type="radio" name="type" value="honor">In Honor of</label>
          <label><input type="radio" name="type" value="memory">In Memory of</label>
        </div>
      </div>

      <!-- Comments -->
      <div class="input-group">
        <label>Message / Comments (optional)</label>
        <textarea id="comments" maxlength="200" rows="3"></textarea>
        <span class="counter">0/200</span>
      </div>

      <!-- Terms -->
      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="terms" required>
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </label>
      </div>

      <div class="buttons">
        <button type="submit" class="btn-primary">Create Account</button>
        <button type="reset" class="btn-outline">Clear Form</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
